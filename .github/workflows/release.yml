name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build NSIS installer and publish release
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dashboard
        run: npm run dashboard:build

      - name: Run unit tests
        run: npm test

      - name: Build NSIS installer
        run: npm run desktop:build

      - name: Compute SHA256 checksum
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release/desktop -Filter 'TokenBar-Setup-*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'NSIS installer not found in release/desktop' }
          $hash = (Get-FileHash -Algorithm SHA256 -Path $exe.FullName).Hash.ToLowerInvariant()
          $checksumFile = Join-Path $exe.DirectoryName 'SHA256SUMS.txt'
          [System.IO.File]::WriteAllText($checksumFile, "$hash  $($exe.Name)`n", [System.Text.UTF8Encoding]::new($false))
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "SHA256: ``$hash``  ($($exe.Name))"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ![dashboard](https://raw.githubusercontent.com/xiaoqi8553/tokenbar/main/docs/shots/dashboard-light.png)
          files: |
            release/desktop/TokenBar-Setup-*.exe
            release/desktop/SHA256SUMS.txt
