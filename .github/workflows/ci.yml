name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Electron binary
        run: npm run electron:install

      - name: Build dashboard
        run: npm run dashboard:build

      - name: Verify artifact
        run: npm run verify:artifact

      - name: Run unit tests
        run: npm test

  smoke:
    name: Desktop smoke + package (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Electron binary
        run: npm run electron:install

      - name: Build dashboard
        run: npm run dashboard:build

      - name: Verify artifact
        run: npm run verify:artifact

      - name: Run unit tests
        run: npm test

      - name: Desktop smoke (Playwright + Electron)
        run: npm run desktop:smoke

      - name: Verify unpacked build
        run: npm run desktop:dir
