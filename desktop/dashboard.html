<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TokenBar · 用量看板</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f3f4f7;
    --panel: #ffffff;
    --panel-soft: #fafbfc;
    --line: #e7e8ee;
    --line-soft: #f0f1f5;
    --text: #16171b;
    --text-2: #555a67;
    --text-3: #8b90a0;
    --accent: #3f6ef0;
    --accent-2: #a9c0fb;
    --accent-3: #dbe5fe;
    --c-cached: #9db6fb;
    --c-input: #3f6ef0;
    --c-output: #f0a33c;
    --c-bar: #4a71e4;
    --warn: #d9822b;
    --ok: #1f9d63;
    --danger: #d9534f;
    --shadow: 0 1px 2px rgba(19, 24, 40, .05), 0 10px 28px rgba(19, 24, 40, .06);
    --radius: 14px;
  }

  html[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1013;
    --panel: #181920;
    --panel-soft: #1d1e26;
    --line: #292b34;
    --line-soft: #23252d;
    --text: #f1f2f6;
    --text-2: #a6abb9;
    --text-3: #6e7482;
    --accent: #5b84ff;
    --accent-2: #34508f;
    --accent-3: #22304f;
    --c-cached: #3f5c9e;
    --c-input: #7aa0ff;
    --c-output: #e8a850;
    --c-bar: #7392ff;
    --warn: #e0a04c;
    --ok: #38b57e;
    --danger: #e06c68;
    --shadow: 0 1px 2px rgba(0, 0, 0, .34), 0 12px 34px rgba(0, 0, 0, .38);
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Microsoft YaHei UI", sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--text-3) 34%, transparent);
    border-radius: 8px;
    border: 3px solid transparent;
    background-clip: padding-box;
  }
  ::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--text-3) 55%, transparent); background-clip: padding-box; border: 3px solid transparent; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------------- 启动屏 ---------------- */

  .boot {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: var(--bg);
    z-index: 40;
    transition: opacity .28s ease;
  }

  .boot.done { opacity: 0; pointer-events: none; }

  .boot-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .boot-mark {
    width: 46px;
    height: 46px;
    border-radius: 13px;
    background: linear-gradient(160deg, #2b57d6, #3f6ef0);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 19px;
    font-weight: 650;
    letter-spacing: -.5px;
    box-shadow: 0 8px 24px rgba(63, 110, 240, .32);
  }

  .boot-text { color: var(--text-2); font-size: 14.5px; }
  .boot-hint { color: var(--text-3); font-size: 13.5px; }

  .boot-bar {
    width: 210px;
    height: 4px;
    border-radius: 4px;
    background: var(--line);
    overflow: hidden;
  }

  .boot-bar i {
    display: block;
    height: 100%;
    width: 12%;
    border-radius: 4px;
    background: var(--accent);
    transition: width .3s ease;
  }

  /* ---------------- 布局 ---------------- */

  .app {
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  .app[hidden] { display: none; }

  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 18px;
    background: color-mix(in srgb, var(--panel) 82%, transparent);
    border-bottom: 1px solid var(--line);
    backdrop-filter: saturate(140%) blur(10px);
    -webkit-app-region: drag;
  }

  .topbar button, .topbar .range { -webkit-app-region: no-drag; }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .brand-mark {
    width: 30px;
    height: 30px;
    border-radius: 9px;
    background: linear-gradient(160deg, #2b57d6, #3f6ef0);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 14px;
    font-weight: 650;
    flex: none;
  }

  .brand-title { font-size: 17px; font-weight: 640; letter-spacing: -.3px; }
  .brand-sub { font-size: 13.5px; color: var(--text-3); }

  .spacer { flex: 1; }

  .range {
    display: flex;
    gap: 2px;
    padding: 2px;
    background: var(--line-soft);
    border-radius: 9px;
  }

  .range button {
    border: 0;
    background: transparent;
    color: var(--text-2);
    font: inherit;
    font-size: 14px;
    padding: 5px 12px;
    border-radius: 7px;
    cursor: pointer;
    transition: background .16s ease, color .16s ease;
  }

  .range button:hover { color: var(--text); }
  .range button[aria-pressed="true"] {
    background: var(--panel);
    color: var(--text);
    font-weight: 580;
    box-shadow: 0 1px 2px rgba(19, 24, 40, .1);
  }

  /* 卡片内的小号切换器 */
  .range.mini button { font-size: 12.5px; padding: 3px 9px; border-radius: 6px; }

  .icon-btn {
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--text-2);
    cursor: pointer;
    transition: color .16s ease, border-color .16s ease, background .16s ease;
  }

  .icon-btn:hover { color: var(--text); border-color: color-mix(in srgb, var(--text-3) 50%, transparent); }
  .icon-btn[data-busy="1"] svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  main {
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 16px 16px;
  }

  .card-head {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 12px;
  }

  .card-head h2 {
    margin: 0;
    font-size: 16px;
    font-weight: 620;
    letter-spacing: -.2px;
  }

  .card-head .sub {
    margin: 3px 0 0;
    font-size: 13.5px;
    color: var(--text-3);
  }

  .card-head .range { margin-left: auto; }
  /* 会话卡同时有视图 Tab 和徽标：Tab 负责吃掉剩余空间，徽标紧贴其右 */
  .card-head #session-badge { margin-left: 12px; }

  .badge {
    margin-left: auto;
    font-size: 13px;
    color: var(--text-3);
    padding: 3px 8px;
    border-radius: 6px;
    background: var(--line-soft);
    white-space: nowrap;
  }

  /* ---------------- 额度卡片 ---------------- */

  .stat-row {
    display: grid;
    /* Codex 5 张卡、WorkBuddy 6 张（多一张速度卡），固定 6 列保证标题不换行 */
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 10px;
  }

  .stat {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 13px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
    /* 两个数据源的提示行数不同，固定下限保证切换时卡片不忽高忽低 */
    min-height: 148px;
  }

  .stat-top {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-wrap: nowrap;
    min-width: 0;
  }

  .stat-label {
    font-size: 14.5px;
    color: var(--text-2);
    font-weight: 560;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  .stat-window {
    margin-left: auto;
    flex: none;
    white-space: nowrap;
    font-size: 12px;
    color: var(--text-3);
    padding: 2px 6px;
    border-radius: 5px;
    background: var(--line-soft);
  }

  .stat-value {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }

  .stat-num {
    font-size: 33px;
    font-weight: 640;
    letter-spacing: -1px;
    line-height: 1.1;
  }

  .stat-unit { font-size: 14px; color: var(--text-3); }

  .meter {
    height: 5px;
    border-radius: 4px;
    background: var(--line-soft);
    overflow: hidden;
  }

  .meter i {
    display: block;
    height: 100%;
    border-radius: 4px;
    background: var(--accent);
    transition: width .45s cubic-bezier(.3, .8, .3, 1);
  }

  .meter i[data-level="high"] { background: var(--warn); }
  .meter i[data-level="full"] { background: var(--danger); }

  .stat-foot {
    font-size: 13.5px;
    color: var(--text-3);
    min-height: 21px;
    /* 单行：不然「11 个会话 · 2,918 次调用」这类长文案会把整行卡片撑高 */
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .stat-foot b { color: var(--text-2); font-weight: 560; }

  .dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ok);
    vertical-align: middle;
    flex: none;
  }
  /* stat-foot 改成块级单行省略后，原来的 flex gap 没了，用外边距补回间距 */
  .stat-foot .dot { margin-right: 6px; }
  .dot[data-tone="warn"] { background: var(--warn); }
  .dot[data-tone="muted"] { background: var(--text-3); }

  /* 额度条上的时间进度刻度：柱子是「已用」，竖线是「时间过了多少」 */
  .meter { position: relative; overflow: visible; }
  .meter .pace {
    position: absolute;
    top: -3px;
    bottom: -3px;
    width: 2px;
    border-radius: 2px;
    background: color-mix(in srgb, var(--text-3) 62%, transparent);
  }

  .stat-hint {
    font-size: 13px;
    color: var(--text-3);
    line-height: 1.3;
    margin-top: -3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 版本徽标 */
  .ver {
    font-size: 12px;
    font-weight: 520;
    color: var(--text-3);
    background: var(--line-soft);
    border-radius: 5px;
    padding: 1px 6px;
    margin-left: 6px;
    text-decoration: none;
    vertical-align: 2px;
    cursor: pointer;
  }
  .ver:hover { color: var(--accent); background: var(--accent-3); }

  /* 金额：数字用等宽表格数字，避免「¥」和数字抖动 */
  .stat-num.money, .bar-money {
    font-variant-numeric: tabular-nums;
  }
  .stat-num.money { font-size: 31px; letter-spacing: -1.5px; }

  .price-link {
    color: var(--text-3);
    text-decoration: underline;
    text-decoration-color: color-mix(in srgb, var(--text-3) 45%, transparent);
    text-underline-offset: 2px;
    cursor: pointer;
  }
  .price-link:hover { color: var(--accent); }

  /* 区间概要条：把「一行小字」换成可读的指标 */
  .summary {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    background: var(--panel-soft);
    margin-bottom: 12px;
    overflow: hidden;
  }
  .summary > div {
    padding: 8px 10px;
    border-left: 1px solid var(--line-soft);
    min-width: 0;
  }
  .summary > div:first-child { border-left: 0; }
  .summary .k { font-size: 12.5px; color: var(--text-3); }
  .summary .v {
    font-size: 18px;
    font-weight: 620;
    letter-spacing: -.3px;
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .summary .v small { font-size: 12.5px; font-weight: 500; color: var(--text-3); margin-left: 5px; }

  /* ---------------- 趋势图 ---------------- */

  .chart-wrap {
    position: relative;
    width: 100%;
    /* 拉高：日常几十 M 的波动在 190px 里几乎是一条直线 */
    height: 280px;
  }

  .chart-wrap svg { display: block; width: 100%; height: 100%; }

  .axis-text {
    fill: var(--text-3);
    font-size: 12.5px;
    font-family: inherit;
  }

  .grid-line {
    stroke: var(--line-soft);
    stroke-width: 1;
    stroke-dasharray: 3 5;
  }

  .legend {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 10px;
    font-size: 12.5px;
    color: var(--text-3);
  }

  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 9px; height: 9px; border-radius: 2.5px; display: inline-block; }
  .legend i.clip { background: var(--warn); border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); }

  .tip {
    position: absolute;
    z-index: 5;
    min-width: 164px;
    padding: 9px 11px;
    background: color-mix(in srgb, var(--panel) 96%, transparent);
    border: 1px solid var(--line);
    border-radius: 9px;
    box-shadow: 0 8px 24px rgba(19, 24, 40, .16);
    font-size: 12.5px;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -100%);
    transition: opacity .12s ease;
  }

  .tip.show { opacity: 1; }
  .tip-title { font-weight: 600; margin-bottom: 5px; color: var(--text); }
  .tip-row { display: flex; justify-content: space-between; gap: 14px; color: var(--text-2); }
  .tip-row b { font-weight: 560; color: var(--text); }

  .note {
    margin: 8px 0 0;
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--text-3);
    padding: 7px 10px;
    border-radius: 8px;
    background: var(--line-soft);
  }

  .note b { color: var(--text-2); font-weight: 560; }

  /* ---------------- 分布条 ---------------- */

  .cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    /* 默认 stretch：模型 / 项目两张卡永远等高，不随行数变化 */
    align-items: stretch;
  }

  .cols > .card { display: flex; flex-direction: column; }

  .bars {
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex: 1;
    min-height: 196px;
  }

  /* 固定行高：切换数据源、行数不同时也不会错位 */
  .bar-row { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; min-height: 28px; align-content: start; }

  .bar-name {
    font-size: 14.5px;
    color: var(--text-2);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }

  .bar-val { font-size: 13.5px; color: var(--text-3); white-space: nowrap; }
  .bar-val b { color: var(--text); font-weight: 560; }
  .bar-extra { color: var(--text-3); }
  .bar-money { color: var(--text-2); font-weight: 560; }
  .bar-speed { color: var(--accent); font-weight: 560; }
  .bar-none { color: var(--text-3); }
  .bar-sep { color: var(--text-3); }

  .bar-track {
    grid-column: 1 / -1;
    height: 6px;
    border-radius: 4px;
    background: var(--line-soft);
    overflow: hidden;
  }

  .bar-track i {
    display: block;
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 62%, var(--accent-3)));
    transition: width .4s cubic-bezier(.3, .8, .3, 1);
  }

  .empty {
    color: var(--text-3);
    font-size: 14px;
    padding: 10px 0;
  }

  /* ---------------- 时段图 ---------------- */

  .hour-tools {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .hour-tools .badge { margin-left: 0; }

  .hours {
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 96px;
  }

  .hour-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    height: 100%;
  }

  .hour-bar {
    width: 100%;
    margin-top: auto;
    border-radius: 3px;
    background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 58%, transparent));
    min-height: 2px;
    transition: background .16s ease;
  }

  .hour-col:hover .hour-bar { background: var(--accent); }

  /* 峰值整点单独染色：切区间后一眼看出高峰挪到了几点 */
  .hour-col.is-peak .hour-bar { box-shadow: inset 0 -2px 0 0 var(--accent); }

  .hour-col.is-peak .hour-label {
    color: var(--accent);
    font-weight: 650;
  }

  .hour-label {
    font-size: 11.5px;
    color: var(--text-3);
    height: 14px;
    line-height: 1;
  }

  /* ---------------- 会话表 ---------------- */

  .table-wrap {
    /* 固定高度：Codex 几十行、WorkBuddy 几行，表格框都一样大，切换不跳 */
    height: 244px;
    overflow-y: auto;
    overflow-x: auto;
    border-radius: 10px;
    border: 1px solid var(--line-soft);
  }

  /* 固定列宽：项目名长短不同也不会把两列撑得不一样宽 */
  table { width: 100%; border-collapse: collapse; font-size: 14px; table-layout: fixed; }

  thead th {
    position: sticky;
    top: 0;
    z-index: 1;
    background: var(--panel-soft);
    color: var(--text-3);
    font-weight: 560;
    font-size: 13px;
    text-align: left;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }

  tbody td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--line-soft);
    color: var(--text-2);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  tbody tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: var(--panel-soft); }
  /* 数字列两边留白收紧一点：速度「102.7 tok/s」、时长「3 天 12 小时」才不会被切 */
  td.num { text-align: right; color: var(--text); font-weight: 540; padding-left: 8px; padding-right: 8px; }
  td.proj { color: var(--text); }
  .muted { color: var(--text-3); }

  .chip {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 5px;
    background: var(--accent-3);
    color: var(--accent);
    font-size: 12.5px;
    font-weight: 540;
  }

  /* ---------------- 会话日志 / 请求明细 ---------------- */

  /* 模型名不再折叠成 +N：整列换行列出，长名字也不截断 */
  td.model-cell, th.model-col { white-space: normal; }
  .model-chips { display: flex; flex-wrap: wrap; gap: 4px 5px; align-items: flex-start; }
  .model-chips .chip { max-width: 100%; overflow-wrap: anywhere; white-space: normal; line-height: 1.35; }
  .chip small { color: var(--text-3); font-weight: 500; margin-left: 4px; }

  /* 点会话行展开模型明细（CC Switch 请求日志的点开形式） */
  tr.session-row { cursor: pointer; }
  tr.session-row.is-open > td { background: var(--panel-soft); }
  .row-caret { display: inline-block; width: 11px; color: var(--text-3); transition: transform .15s ease; }
  tr.is-open .row-caret { transform: rotate(90deg); }
  tr.detail-row > td { padding: 4px 12px 12px; background: var(--panel-soft); white-space: normal; }
  .detail-panel { border-left: 2px solid var(--accent-2); padding-left: 12px; }
  .detail-meta { font-size: 12px; color: var(--text-3); margin-bottom: 8px; overflow-wrap: anywhere; }
  .detail-table { table-layout: auto !important; font-size: 12.5px !important; }
  .detail-table th { position: static; padding: 4px 8px; font-size: 12px; }
  .detail-table td { padding: 4px 8px; border-bottom: 1px solid var(--line-soft); }
  .detail-table .model-name { color: var(--text); font-weight: 540; overflow-wrap: anywhere; white-space: normal; }

  /* 请求明细：一行一个「会话 × 模型」，列多就横向滚，但绝不裁模型名 */
  table.log-table { min-width: 1040px; }
  table.log-table td.model-cell { color: var(--text); font-weight: 540; overflow-wrap: anywhere; }
  .log-note { color: var(--text-3); font-size: 12px; padding: 8px 12px; }

  /* ---------------- 底栏 ---------------- */

  .statusbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 18px;
    border-top: 1px solid var(--line);
    background: color-mix(in srgb, var(--panel) 82%, transparent);
    font-size: 13.5px;
    color: var(--text-3);
  }

  @media (max-width: 1120px) {
